name: Repack Boot Image

on:
  workflow_dispatch:

jobs:
  repack:
    runs-on: ubuntu-22.04

    steps:
    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip curl wget python3

    - name: Download Files
      run: |
        wget -O boot-original.img "https://raw.githubusercontent.com/user0admin/kernel-xz1-usb-lan/main/boot.img"
        wget -O kernel-new.gz-dtb "https://raw.githubusercontent.com/user0admin/kernel-xz1-usb-lan/main/Image.gz-dtb"
        ls -la

    - name: Clone mkbootimg Tools
      run: |
        git clone --depth 1 https://github.com/osm0sis/mkbootimg.git
        cd mkbootimg
        make -j$(nproc)
        sudo cp mkbootimg /usr/local/bin/

    - name: Unpack Original Boot Image
      run: |
        cd mkbootimg
        ./unpackbootimg -i ../boot-original.img -o ../boot-extracted
        ls -la ../boot-extracted/

    - name: Repack with New Kernel
      run: |
        cd mkbootimg
        cp ../kernel-new.gz-dtb ../boot-extracted/boot.img-kernel
        ./mkbootimg \
          --kernel ../boot-extracted/boot.img-kernel \
          --ramdisk ../boot-extracted/boot.img-ramdisk.gz \
          --cmdline "$(cat ../boot-extracted/boot.img-cmdline)" \
          --base 0x20000000 --pagesize 2048 \
          --output ../new-boot.img
        ls -la ../new-boot.img

    - name: Upload New Boot Image
      uses: actions/upload-artifact@v4
      with:
        name: new-boot
        path: new-boot.img
