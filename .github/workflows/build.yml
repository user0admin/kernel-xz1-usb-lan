name: Repack Boot Image

on:
  workflow_dispatch:

jobs:
  repack:
    runs-on: ubuntu-22.04

    steps:
    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip curl wget python3 cpio

    - name: Download Files
      run: |
        wget -O boot-original.img "https://raw.githubusercontent.com/user0admin/kernel-xz1-usb-lan/main/boot.img"
        wget -O kernel-new.gz-dtb "https://raw.githubusercontent.com/user0admin/kernel-xz1-usb-lan/main/Image.gz-dtb"
        ls -la

    - name: Download AIK
      run: |
        wget -O AIK.tar.gz "https://github.com/Sigma-Solutions/Android-Image-Kitchen/archive/refs/heads/master.tar.gz"
        tar -xzf AIK.tar.gz
        mv Android-Image-Kitchen-master AIK
        cd AIK
        chmod +x unpackimg.sh repackimg.sh

    - name: Unpack Original Boot Image
      run: |
        cd AIK
        ./unpackimg.sh ../boot-original.img
        echo "===== ISI boot-extracted ====="
        ls -la split_img/
        echo "=============================="

    - name: Ganti Kernel
      run: |
        cd AIK
        # Lihat nama file kernel di split_img
        ls -la split_img/
        # Ganti kernel (biasanya boot.img-kernel)
        cp ../kernel-new.gz-dtb split_img/boot.img-kernel
        echo "===== Kernel sudah diganti ====="

    - name: Repack Boot Image
      run: |
        cd AIK
        ./repackimg.sh
        mv image-new.img ../new-boot.img
        echo "===== Hasil Repack ====="
        ls -la ../new-boot.img

    - name: Upload New Boot Image
      uses: actions/upload-artifact@v4
      with:
        name: new-boot
        path: new-boot.img
