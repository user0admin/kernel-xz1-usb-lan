- name: Build Kernel
  run: |
    export ARCH=arm64
    export SUBARCH=arm64
    export CROSS_COMPILE=aarch64-linux-gnu-
    export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
    make O=out lineage-msm8998-yoshino-poplar_defconfig
    echo "===== CEK CONFIG ====="
    grep -E "CONFIG_USB_NET|CONFIG_USB_USBNET" out/.config || echo "DRIVER TIDAK DITEMUKAN"
    echo "======================"
    make O=out -j$(nproc) 2>&1 | tee build.log
