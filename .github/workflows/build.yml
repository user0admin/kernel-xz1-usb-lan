name: Repack Boot Image

on:
  workflow_dispatch:

jobs:
  repack:
    runs-on: ubuntu-22.04

    steps:
    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip curl wget python3 cpio

    - name: Download Files
      run: |
        wget -O boot-original.img "https://raw.githubusercontent.com/user0admin/kernel-xz1-usb-lan/main/boot.img"
        wget -O kernel-new.gz-dtb "https://raw.githubusercontent.com/user0admin/kernel-xz1-usb-lan/main/Image.gz-dtb"
        ls -la

    - name: Download AIK (versi lengkap)
      run: |
        wget -O AIK.tar.gz "https://github.com/ndrancs/AIK-Linux-x32-x64/archive/refs/heads/master.tar.gz"
        tar -xzf AIK.tar.gz
        ls -la

    - name: Unpack Original Boot Image
      run: |
        cd AIK-Linux-x32-x64-master
        chmod +x unpackimg_x64.sh repackimg_x64.sh
        ./unpackimg_x64.sh ../boot-original.img
        echo "===== ISI split_img ====="
        ls -la split_img/
        echo "========================"

    - name: Ganti Kernel
      run: |
        cd AIK-Linux-x32-x64-master
        cp ../kernel-new.gz-dtb split_img/boot.img-kernel
        echo "===== Kernel sudah diganti ====="

    - name: Repack Boot Image
      run: |
        cd AIK-Linux-x32-x64-master
        ./repackimg_x64.sh
        mv image-new.img ../new-boot.img
        echo "===== Hasil Repack ====="
        ls -la ../new-boot.img

    - name: Upload New Boot Image
      uses: actions/upload-artifact@v4
      with:
        name: new-boot
        path: new-boot.img
