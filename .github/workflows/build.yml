name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libssl-dev bc flex bison libncurses-dev libelf-dev git zip unzip curl wget gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make O=out lineage-msm8998-yoshino-poplar_defconfig
        make O=out -j$(nproc)

    - name: Upload boot.img
      uses: actions/upload-artifact@v4
      with:
        name: kernel-output
        path: out/arch/arm64/boot/
