name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential libssl-dev bc flex bison libncurses-dev libelf-dev git zip unzip curl wget gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        make O=out lineage-msm8998-yoshino-poplar_defconfig
        scripts/config --file out/.config -d CONFIG_WERROR
        scripts/config --file out/.config -e CONFIG_WLAN_VENDOR_QCACLD 2>/dev/null || true
        make O=out -j$(nproc) KCFLAGS="-Wno-error" 2>&1 | tail -100

    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: kernel-output
        path: |
          out/arch/arm64/boot/Image.gz-dtb
          out/arch/arm64/boot/Image

    - name: Upload Config
      uses: actions/upload-artifact@v4
      with:
        name: kernel-config
        path: out/.config
